<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231a47"/>
      <stop offset="0.55" stop-color="#130f26"/>
      <stop offset="1" stop-color="#0a0913"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e0ff"/>
      <stop offset="1" stop-color="#8f76ff"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ad7ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5ad7ff" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#9ee8ff"/>
      <stop offset="1" stop-color="#6b5cff"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>
  <!-- the alter ego: a ghost of the A, shifted -->
  <path d="M168 376 L268 136 L368 376" fill="none" stroke="url(#ghost)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" transform="translate(22 0)" opacity="0.55"/>
  <!-- the A -->
  <path d="M146 384 L256 124 L366 384" fill="none" stroke="url(#stroke)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the spark that knows you -->
  <circle cx="256" cy="304" r="34" fill="url(#orb)"/>
</svg>
