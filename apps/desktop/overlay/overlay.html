<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>ALTTER agents</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; font: 13px/1.3 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; color: #fff; user-select: none; }
  .agent { position: absolute; left: 0; top: 0; will-change: transform; transition: transform .42s cubic-bezier(.22, 1, .36, 1), opacity .5s; pointer-events: none; }
  .agent.idle { opacity: .55; }
  .agent.hidden { opacity: 0; }
  .ptr { position: absolute; left: -3px; top: -2px; width: 28px; height: 28px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); transform-origin: 3px 2px; transition: transform .15s; }
  .agent.press .ptr { transform: scale(.82); }
  .tag { position: absolute; left: 20px; top: 22px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .name { padding: 3px 9px 3px 8px; border-radius: 9px 9px 9px 3px; font-weight: 700; font-size: 12.5px; letter-spacing: .01em; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.35); display: flex; align-items: center; gap: 6px; }
  .name i { width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .9; animation: blink 1.2s infinite; }
  .act { padding: 3px 8px; border-radius: 7px; background: rgba(12, 11, 22, .82); backdrop-filter: blur(8px); font-size: 11.5px; color: rgba(255,255,255,.88); white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; opacity: 0; transform: translateY(-3px); transition: opacity .2s, transform .2s; border: 1px solid rgba(255,255,255,.08); }
  .act.on { opacity: 1; transform: none; }
  .bubble { position: absolute; left: 22px; top: -46px; max-width: 320px; padding: 8px 12px; border-radius: 14px 14px 14px 4px; background: rgba(12, 11, 22, .9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.12); font-size: 13px; line-height: 1.35; box-shadow: 0 10px 30px rgba(0,0,0,.4); opacity: 0; transform: translateY(6px) scale(.96); transform-origin: 0 100%; transition: opacity .25s, transform .3s cubic-bezier(.22, 1, .36, 1); white-space: normal; width: max-content; }
  .bubble.on { opacity: 1; transform: none; }
  .bubble.typing::after { content: '▍'; animation: blink 1s infinite; margin-left: 1px; }
  @keyframes blink { 50% { opacity: .2; } }
  .ripple { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2.5px solid; pointer-events: none; animation: ripple .6s cubic-bezier(.2, .8, .3, 1) forwards; }
  .ripple.dbl { animation-duration: .8s; }
  @keyframes ripple { from { transform: scale(.4); opacity: 1; } to { transform: scale(4.2); opacity: 0; } }
  .trail { position: absolute; height: 3px; border-radius: 3px; transform-origin: 0 50%; opacity: .75; pointer-events: none; animation: fade 1.2s .4s forwards; }
  @keyframes fade { to { opacity: 0; } }
  .scan { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .scan.go { animation: scan 0.9s ease-out; }
  @keyframes scan { 0% { opacity: 1; clip-path: inset(0 0 100% 0); } 60% { opacity: .9; clip-path: inset(0 0 0 0); } 100% { opacity: 0; clip-path: inset(0 0 0 0); } }
  .scan::before { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--c), inset 0 0 60px color-mix(in srgb, var(--c) 35%, transparent); border-radius: 6px; }
  .keys { position: absolute; left: 22px; top: -40px; display: flex; gap: 4px; opacity: 0; transition: opacity .2s; }
  .keys.on { opacity: 1; }
  .keys kbd { font: 600 12px/1 'Segoe UI', system-ui; padding: 6px 8px; border-radius: 7px; background: rgba(255,255,255,.95); color: #111; box-shadow: 0 3px 0 rgba(0,0,0,.35), 0 8px 18px rgba(0,0,0,.3); }

  .hud { position: absolute; right: 22px; bottom: 64px; width: 300px; padding: 14px; border-radius: 18px; background: rgba(14, 12, 26, .82); backdrop-filter: blur(18px) saturate(1.4); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 24px 60px rgba(0,0,0,.5); opacity: 0; transform: translateY(14px) scale(.97); transition: opacity .35s, transform .45s cubic-bezier(.22, 1, .36, 1); pointer-events: auto; }
  .hud.on { opacity: 1; transform: none; }
  .hud-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 700; font-size: 13px; }
  .hud-head svg { width: 16px; height: 16px; }
  .hud-head span { margin-left: auto; font-weight: 500; font-size: 11px; color: rgba(255,255,255,.5); }
  .row { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 10px; background: rgba(255,255,255,.04); margin-bottom: 5px; transition: background .2s; }
  .row b { font-size: 12.5px; }
  .row .what { margin-left: auto; font-size: 11.5px; color: rgba(255,255,255,.65); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; position: relative; }
  .dot::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid; border-color: inherit; opacity: 0; animation: pulse 1.8s infinite; }
  @keyframes pulse { 0% { opacity: .8; transform: scale(.5); } 100% { opacity: 0; transform: scale(1.6); } }
  .stop { margin-top: 8px; width: 100%; height: 38px; border: 0; border-radius: 11px; background: linear-gradient(135deg, #ff4d5e, #e5484d); color: #fff; font: 700 13px 'Segoe UI', system-ui; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 8px 22px rgba(229, 72, 77, .4); transition: transform .15s, filter .15s; }
  .stop:hover { filter: brightness(1.1); }
  .stop:active { transform: scale(.97); }
  .stop small { opacity: .7; font-weight: 500; }
  .claim { position: absolute; border: 2px dashed var(--c); border-radius: 12px; background: color-mix(in srgb, var(--c) 7%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 25%, transparent), 0 0 32px -6px var(--c) inset; pointer-events: none; animation: claim-in .45s cubic-bezier(.2,.9,.3,1.2) both; transition: opacity .4s; }
  .claim.out { opacity: 0; }
  .claim b { position: absolute; top: -13px; left: 12px; padding: 3px 9px; border-radius: 99px; background: var(--c); color: #fff; font: 600 11px/1.2 system-ui, sans-serif; white-space: nowrap; box-shadow: 0 4px 14px -4px var(--c); }
  @keyframes claim-in { from { opacity: 0; transform: scale(.96); } }
</style>
</head>
<body>
<div id="scan" class="scan"></div>
<div id="layer"></div>
<div id="hud" class="hud" hidden>
  <div class="hud-head">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.6 12.6 21 21"/><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
    <b id="hud-title"></b><span id="hud-time"></span>
  </div>
  <div id="rows"></div>
  <button class="stop" id="stop"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg><span id="stop-label"></span><small>Ctrl+Alt+Q</small></button>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const primary = q.get('primary') === '1';
  const L = {
    en: { title: 'Agents at work', stop: 'Stop all', look: 'looking at the screen', aim: 'moving', click: 'click', 'double-click': 'double-click', 'right-click': 'right-click', move: 'moving', drag: 'dragging', scroll: 'scrolling', type: 'typing', key: 'keys', open: 'opening', wait: 'waiting', say: 'says', note: 'note for the team', stopped: 'stopped', done: 'done', hold: 'has the mouse' },
    pl: { title: 'Agenci przy pracy', stop: 'Zatrzymaj wszystkich', look: 'patrzy na ekran', aim: 'przesuwa', click: 'klika', 'double-click': 'dwuklik', 'right-click': 'prawy klik', move: 'przesuwa', drag: 'przeciąga', scroll: 'przewija', type: 'pisze', key: 'skrót', open: 'otwiera', wait: 'czeka', say: 'mówi', note: 'notatka dla zespołu', stopped: 'zatrzymany', done: 'gotowe', hold: 'przejął myszkę' },
    de: { title: 'Agenten bei der Arbeit', stop: 'Alle stoppen', look: 'schaut auf den Bildschirm', aim: 'bewegt', click: 'klickt', 'double-click': 'Doppelklick', 'right-click': 'Rechtsklick', move: 'bewegt', drag: 'zieht', scroll: 'scrollt', type: 'tippt', key: 'Tasten', open: 'öffnet', wait: 'wartet', say: 'sagt', note: 'Notiz fürs Team', stopped: 'gestoppt', done: 'fertig', hold: 'hat die Maus' },
    es: { title: 'Agentes trabajando', stop: 'Detener a todos', look: 'mira la pantalla', aim: 'mueve', click: 'clic', 'double-click': 'doble clic', 'right-click': 'clic derecho', move: 'mueve', drag: 'arrastra', scroll: 'desplaza', type: 'escribe', key: 'teclas', open: 'abre', wait: 'espera', say: 'dice', note: 'nota para el equipo', stopped: 'detenido', done: 'listo', hold: 'tiene el ratón' },
    fr: { title: 'Agents au travail', stop: 'Tout arrêter', look: 'regarde l’écran', aim: 'déplace', click: 'clic', 'double-click': 'double-clic', 'right-click': 'clic droit', move: 'déplace', drag: 'glisse', scroll: 'défile', type: 'tape', key: 'touches', open: 'ouvre', wait: 'attend', say: 'dit', note: 'note pour l’équipe', stopped: 'arrêté', done: 'terminé', hold: 'a la souris' },
    uk: { title: 'Агенти працюють', stop: 'Зупинити всіх', look: 'дивиться на екран', aim: 'рухає', click: 'клік', 'double-click': 'подвійний клік', 'right-click': 'правий клік', move: 'рухає', drag: 'тягне', scroll: 'гортає', type: 'пише', key: 'клавіші', open: 'відкриває', wait: 'чекає', say: 'каже', note: 'нотатка для команди', stopped: 'зупинено', done: 'готово', hold: 'тримає мишу' },
  }[q.get('lang')] || null;
  const T = L || { title: 'Agents at work', stop: 'Stop all' };
  const tr = (k) => (L && L[k]) || k;
  document.getElementById('hud-title').textContent = T.title;
  document.getElementById('stop-label').textContent = T.stop;

  const layer = document.getElementById('layer');
  const agents = new Map(); // id → { el, name, color, x, y, action, timer }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  function pointer(color) {
    return `<svg class="ptr" viewBox="0 0 28 28"><path d="M4 2.5 L4 22 L9.2 17.2 L12.6 25 L16.2 23.4 L12.9 15.8 L20 15.8 Z" fill="${color}" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
  }
  function get(m) {
    let a = agents.get(m.id);
    if (a) return a;
    const el = document.createElement('div');
    el.className = 'agent hidden';
    el.innerHTML = pointer(m.color) + `<div class="bubble"></div><div class="keys"></div><div class="tag"><div class="name" style="background:${m.color}"><i></i>${esc(m.name)}</div><div class="act"></div></div>`;
    layer.appendChild(el);
    const n = agents.size;
    a = { el, name: m.name, color: m.color, x: innerWidth / 2 - 120 + n * 90, y: innerHeight / 2 + n * 40, action: '', bubbleTimer: 0, idleTimer: 0, keysTimer: 0, onScreen: false };
    agents.set(m.id, a);
    place(a);
    return a;
  }
  function place(a) { a.el.style.transform = `translate(${a.x}px, ${a.y}px)`; }
  function act(a, text) {
    const el = a.el.querySelector('.act');
    el.textContent = text;
    el.classList.toggle('on', !!text);
    a.action = text;
    a.el.classList.remove('idle');
    clearTimeout(a.idleTimer);
    a.idleTimer = setTimeout(() => { a.el.classList.add('idle'); el.classList.remove('on'); }, 7000);
    renderHud();
  }
  function bubble(a, text, typing, ms = 4200) {
    const b = a.el.querySelector('.bubble');
    b.textContent = text;
    b.classList.toggle('typing', !!typing);
    b.classList.add('on');
    clearTimeout(a.bubbleTimer);
    a.bubbleTimer = setTimeout(() => b.classList.remove('on'), ms);
  }
  function keys(a, combo) {
    const k = a.el.querySelector('.keys');
    k.innerHTML = combo.split('+').map((x) => `<kbd>${esc(x.trim())}</kbd>`).join('');
    k.classList.add('on');
    clearTimeout(a.keysTimer);
    a.keysTimer = setTimeout(() => k.classList.remove('on'), 1400);
  }
  function ripple(x, y, color, dbl) {
    for (let i = 0; i < (dbl ? 2 : 1); i++) {
      const r = document.createElement('div');
      r.className = 'ripple' + (dbl ? ' dbl' : '');
      r.style.cssText = `left:${x}px;top:${y}px;border-color:${color};animation-delay:${i * 0.14}s`;
      layer.appendChild(r);
      setTimeout(() => r.remove(), 1100);
    }
  }
  function trail(x1, y1, x2, y2, color) {
    const t = document.createElement('div');
    const len = Math.hypot(x2 - x1, y2 - y1);
    t.className = 'trail';
    t.style.cssText = `left:${x1}px;top:${y1}px;width:${len}px;background:linear-gradient(90deg,transparent,${color});transform:rotate(${Math.atan2(y2 - y1, x2 - x1)}rad)`;
    layer.appendChild(t);
    setTimeout(() => t.remove(), 1700);
  }
  function scan(color) {
    const s = document.getElementById('scan');
    s.style.setProperty('--c', color);
    s.classList.remove('go');
    void s.offsetWidth;
    s.classList.add('go');
  }

  // ---------- HUD (main monitor only) ----------
  const hud = document.getElementById('hud');
  const started = Date.now();
  function renderHud() {
    if (!primary) return;
    const list = [...agents.values()];
    hud.hidden = !list.length;
    requestAnimationFrame(() => hud.classList.toggle('on', list.length > 0));
    document.getElementById('rows').innerHTML = list.map((a) => `<div class="row"><span class="dot" style="background:${a.color};border-color:${a.color}"></span><b>${esc(a.name)}</b><span class="what">${esc(a.action || '…')}</span></div>`).join('');
  }
  setInterval(() => {
    if (!primary || hud.hidden) return;
    const s = Math.floor((Date.now() - started) / 1000);
    document.getElementById('hud-time').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }, 1000);
  // clickable only while hovered (the window ignores the mouse otherwise, so apps below keep working)
  let inside = false;
  addEventListener('mousemove', (e) => {
    const r = hud.getBoundingClientRect();
    const now = !hud.hidden && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (now !== inside) { inside = now; window.alterOverlay.setInteractive(now); }
  });
  document.getElementById('stop').addEventListener('click', () => window.alterOverlay.stop());

  // ---------- events from ALTTER ----------
  window.alterOverlay.on((m) => {
    if (m.type === 'hands.stopped') {
      for (const a of agents.values()) { act(a, tr('stopped')); bubble(a, '⏹ ' + tr('stopped'), false, 2500); }
      return;
    }
    if (m.type === 'hands.session') {
      if (!m.open) {
        const a = agents.get(m.token);
        if (a) {
          act(a, tr('done'));
          a.el.classList.add('hidden');
          if (a.claimEl) { a.claimEl.classList.add('out'); setTimeout(() => a.claimEl && a.claimEl.remove(), 400); }
          setTimeout(() => { a.el.remove(); agents.delete(m.token); renderHud(); }, 600);
        }
      } else { get({ id: m.token, name: m.name, color: m.color }); renderHud(); }
      return;
    }
    if (!m.name) return;
    const a = get(m);
    const visible = typeof m.lx === 'number' && m.lx >= -20 && m.ly >= -20 && m.lx <= m.w + 20 && m.ly <= m.h + 20;
    if (typeof m.lx === 'number') {
      a.onScreen = visible;
      a.el.classList.toggle('hidden', !visible);
      if (visible) { a.x = m.lx; a.y = m.ly; place(a); }
    } else if (!a.onScreen && primary) {
      a.el.classList.remove('hidden');
    }
    const label = tr(m.label || m.kind);
    switch (m.kind) {
      case 'look': act(a, tr('look')); if (primary || a.onScreen) scan(a.color); break;
      case 'aim': case 'move': act(a, tr(m.label === 'move' ? 'move' : m.label || 'aim')); break;
      case 'click':
        act(a, label);
        if (visible) {
          a.el.classList.add('press');
          setTimeout(() => a.el.classList.remove('press'), 160);
          ripple(m.lx, m.ly, a.color, m.clicks > 1);
        }
        break;
      case 'drag': act(a, tr('drag')); if (visible && typeof m.lfromX === 'number') trail(m.lfromX, m.lfromY, m.lx, m.ly, a.color); break;
      case 'scroll': act(a, tr('scroll') + (m.dy > 0 ? ' ↓' : ' ↑')); break;
      case 'type': act(a, tr('type')); if (a.onScreen || primary) bubble(a, m.text || '', true, 2600); break;
      case 'key': act(a, tr('key') + ' ' + (m.keys || '')); if (a.onScreen || primary) keys(a, m.keys || ''); break;
      case 'open': act(a, tr('open') + ' ' + (m.text || '')); break;
      case 'wait': act(a, tr('wait') + ` ${m.seconds}s`); break;
      case 'say': act(a, tr(m.label === 'note' ? 'note' : 'say')); if (a.onScreen || primary) bubble(a, m.text || '', false, 5200); break;
      case 'claim': {
        act(a, '▣ ' + (m.label || ''));
        a.claimEl?.remove();
        if (typeof m.lx === 'number' && typeof m.lx2 === 'number') {
          const c = document.createElement('div');
          c.className = 'claim';
          c.style.setProperty('--c', a.color);
          Object.assign(c.style, { left: m.lx + 'px', top: m.ly + 'px', width: Math.max(10, m.lx2 - m.lx) + 'px', height: Math.max(10, m.ly2 - m.ly) + 'px' });
          const b = document.createElement('b');
          b.textContent = a.name + ' · ' + (m.label || '');
          c.appendChild(b);
          document.body.appendChild(c);
          a.claimEl = c;
        }
        break;
      }
      case 'unclaim': if (a.claimEl) { const c = a.claimEl; a.claimEl = null; c.classList.add('out'); setTimeout(() => c.remove(), 400); } break;
      case 'hold': act(a, '🔒 ' + tr('hold')); break;
      default: act(a, label);
    }
  });
</script>
</body>
</html>
